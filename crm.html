<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM Clients</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#f5f4f1;
  --panel:#fff;
  --text:#1c2b3a;
  --soft:#657383;
  --line:#dedbd3;
  --blue:#1e3a52;
  --green:#3d7a5a;
  --orange:#c9862f;
  --red:#b04a3f;
}

body{
  margin:0;
  padding:25px 18px 60px;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.wrap{
  max-width:1200px;
  margin:auto;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:20px;
  flex-wrap:wrap;
}

h1{
  margin:0 0 5px;
  font-size:23px;
}

.sub{
  margin:0;
  color:var(--soft);
  font-size:13px;
}

button{
  border:0;
  border-radius:8px;
  padding:9px 14px;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
}

.primary{
  background:var(--blue);
  color:white;
}

.secondary{
  background:white;
  color:var(--blue);
  border:1px solid var(--line);
}

.danger{
  background:white;
  color:var(--red);
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.search{
  flex:1;
  min-width:240px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:8px;
  font-size:14px;
}

.tabs{
  display:flex;
  gap:5px;
  background:white;
  border:1px solid var(--line);
  padding:4px;
  border-radius:8px;
}

.tab{
  background:transparent;
  color:var(--soft);
  padding:7px 11px;
}

.tab.active{
  background:var(--blue);
  color:white;
}

.panel{
  background:white;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:hidden;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  background:#f0eee8;
  color:var(--soft);
  text-align:left;
  padding:11px 12px;
  font-size:11px;
  text-transform:uppercase;
  border-bottom:1px solid var(--line);
}

td{
  padding:12px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  vertical-align:top;
}

.name{
  font-weight:700;
}

.muted{
  color:var(--soft);
  font-size:12px;
  margin-top:3px;
}

.badge{
  display:inline-block;
  padding:4px 9px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
}

.relance{
  background:#fbeee0;
  color:var(--orange);
}

.attente{
  background:#eceae5;
  color:var(--soft);
}

.cloture{
  background:#e6f1ea;
  color:var(--green);
}

.activity{
  display:inline-block;
  padding:4px 8px;
  border-radius:6px;
  font-size:11px;
  font-weight:700;
}

.vitres{
  background:#e2edf5;
  color:var(--blue);
}

.ramonage{
  background:#efe6dc;
  color:#7a4a25;
}

.actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.empty{
  text-align:center;
  padding:60px 20px;
  color:var(--soft);
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(19,40,55,.5);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:100;
}

.modal{
  width:100%;
  max-width:600px;
  max-height:90vh;
  overflow:auto;
  background:white;
  border-radius:12px;
  padding:25px;
}

.modal h2{
  margin-top:0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:5px;
  font-size:12px;
  font-weight:700;
  color:var(--soft);
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:9px;
  border:1px solid var(--line);
  border-radius:7px;
  font-family:inherit;
  font-size:14px;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  margin-top:20px;
}

.docs{
  display:flex;
  flex-direction:column;
  gap:5px;
}

.doc{
  cursor:pointer;
  background:#eceae5;
  padding:5px 8px;
  border-radius:6px;
  font-size:11px;
}

.toast{
  position:fixed;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  background:var(--blue);
  color:white;
  padding:11px 18px;
  border-radius:8px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
}

.toast.show{
  opacity:1;
}

.loading{
  padding:60px;
  text-align:center;
  color:var(--soft);
}

@media(max-width:700px){
  .grid{
    grid-template-columns:1fr;
  }

  table,thead,tbody,tr,td{
    display:block;
  }

  thead{
    display:none;
  }

  tr{
    padding:12px;
    border-bottom:1px solid var(--line);
  }

  td{
    border:0;
    padding:5px 0;
  }
}
</style>
</head>

<body>

<div class="wrap" id="app">
  <div class="loading">Chargement de la base clients...</div>
</div>

<div class="toast" id="toast"></div>

<!-- Client Supabase (chargé depuis un CDN) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   CONFIGURATION SUPABASE
   -> à remplir avant de commit
========================= */

const SUPABASE_URL = "https://pomxeutdrrjckvmvtvdg.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Dutlj4y-6uB7qn3Fijiu1g_d6qP4dtH";
const TABLE_CLIENTS = "clients";
const BUCKET_DOCS = "documents-clients";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


const STATUTS=[
  {v:"a_relancer",label:"À relancer",cls:"relance"},
  {v:"en_attente",label:"En attente",cls:"attente"},
  {v:"cloture",label:"Clôturé",cls:"cloture"}
];

const ACTIVITES=[
  {v:"vitres",label:"Vitres",cls:"vitres"},
  {v:"ramonage",label:"Ramonage",cls:"ramonage"}
];

let clients=[];
let searchTerm="";
let filterActivite="toutes";
let filterStatut="tous";
let editingId=null;

const app=document.getElementById("app");
const toastEl=document.getElementById("toast");

function toast(message){
  toastEl.textContent=message;
  toastEl.classList.add("show");

  setTimeout(()=>{
    toastEl.classList.remove("show");
  },2200);
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function statut(v){
  return STATUTS.find(x=>x.v===v)||STATUTS[1];
}

function activite(v){
  return ACTIVITES.find(x=>x.v===v)||null;
}


/* =========================
   MAPPING SUPABASE <-> APP
   (la table utilise le snake_case,
   l'app utilise le camelCase)
========================= */

function rowToClient(row){
  return {
    id:row.id,
    nom:row.nom||"",
    prenom:row.prenom||"",
    email:row.email||"",
    telephone:row.telephone||"",
    adresse:row.adresse||"",
    activite:row.activite||"vitres",
    dateIntervention:row.date_intervention||"",
    typeIntervention:row.type_intervention||"",
    statut:row.statut||"en_attente",
    notes:row.notes||"",
    docs:row.docs||[]
  };
}

function clientToRow(client){
  return {
    id:client.id,
    nom:client.nom,
    prenom:client.prenom,
    email:client.email,
    telephone:client.telephone,
    adresse:client.adresse,
    activite:client.activite,
    date_intervention:client.dateIntervention || null,
    type_intervention:client.typeIntervention,
    statut:client.statut,
    notes:client.notes,
    docs:client.docs||[]
  };
}


/* =========================
   CHARGEMENT DEPUIS SUPABASE
========================= */

async function loadClients(){

  try{

    const {data,error}=await supabaseClient
      .from(TABLE_CLIENTS)
      .select("*")
      .order("date_intervention",{ascending:false});

    if(error){
      throw error;
    }

    clients=(data||[]).map(rowToClient);

  }catch(error){

    console.error(error);
    clients=[];
    toast("Erreur de chargement Supabase");

  }

  render();
}


/* =========================
   FILTRAGE
========================= */

function getClients(){

  let list=[...clients];

  if(filterActivite!=="toutes"){
    list=list.filter(c=>c.activite===filterActivite);
  }

  if(filterStatut==="relance"){
    list=list.filter(c=>c.statut==="a_relancer");
  }

  if(searchTerm.trim()){

    const text=searchTerm.toLowerCase();

    list=list.filter(c=>{

      const value=[
        c.nom,
        c.prenom,
        c.email,
        c.telephone,
        c.adresse,
        c.typeIntervention,
        c.notes
      ].join(" ").toLowerCase();

      return value.includes(text);

    });

  }

  return list.sort((a,b)=>
    (b.dateIntervention||"").localeCompare(
      a.dateIntervention||""
    )
  );
}


/* =========================
   AFFICHAGE
========================= */

function render(){

  const list=getClients();

  app.innerHTML=`

    <header>

      <div>
        <h1>CRM Clients — Vitres & Ramonage</h1>

        <p class="sub">
          ${clients.length}
          client${clients.length>1?"s":""}
          en base · sauvegarde automatique dans Supabase
        </p>
      </div>

      <div>
        <button class="secondary" id="exportBtn">
          Exporter CSV
        </button>

        <button class="primary" id="newBtn">
          + Nouveau client
        </button>
      </div>

    </header>


    <div class="toolbar">

      <input
        class="search"
        id="search"
        placeholder="Rechercher un client..."
        value="${escapeHtml(searchTerm)}"
      >

      <div class="tabs">

        <button
          class="tab ${filterActivite==="toutes"?"active":""}"
          data-activity="toutes">
          Toutes
        </button>

        <button
          class="tab ${filterActivite==="vitres"?"active":""}"
          data-activity="vitres">
          Vitres
        </button>

        <button
          class="tab ${filterActivite==="ramonage"?"active":""}"
          data-activity="ramonage">
          Ramonage
        </button>

      </div>

      <div class="tabs">

        <button
          class="tab ${filterStatut==="tous"?"active":""}"
          data-status="tous">
          Tous
        </button>

        <button
          class="tab ${filterStatut==="relance"?"active":""}"
          data-status="relance">
          À relancer
        </button>

      </div>

    </div>


    <div class="panel">

      ${
        list.length===0

        ?

        `
        <div class="empty">

          <strong>Aucun client</strong>

          <p>
            Clique sur « Nouveau client » pour commencer.
          </p>

        </div>
        `

        :

        `

        <table>

          <thead>

            <tr>
              <th>Client</th>
              <th>Contact</th>
              <th>Activité</th>
              <th>Intervention</th>
              <th>Statut</th>
              <th>Documents</th>
              <th>Actions</th>
            </tr>

          </thead>

          <tbody>

            ${list.map(c=>{

              const a=activite(c.activite);
              const s=statut(c.statut);

              return `

              <tr>

                <td>

                  <div class="name">
                    ${escapeHtml(c.prenom||"")}
                    ${escapeHtml(c.nom||"")}
                  </div>

                  <div class="muted">
                    ${escapeHtml(c.adresse||"")}
                  </div>

                </td>


                <td>

                  ${escapeHtml(c.email||"")}

                  ${
                    c.telephone
                    ?
                    `<div class="muted">${escapeHtml(c.telephone)}</div>`
                    :
                    ""
                  }

                </td>


                <td>

                  ${
                    a
                    ?
                    `<span class="activity ${a.cls}">
                      ${a.label}
                    </span>`
                    :
                    "—"
                  }

                </td>


                <td>

                  <div>
                    ${escapeHtml(c.typeIntervention||"—")}
                  </div>

                  <div class="muted">
                    ${escapeHtml(c.dateIntervention||"")}
                  </div>

                </td>


                <td>

                  <span class="badge ${s.cls}">
                    ${s.label}
                  </span>

                </td>


                <td>

                  <div class="docs">

                    ${
                      (c.docs||[]).length===0

                      ?

                      `<span class="muted">Aucun</span>`

                      :

                      c.docs.map(d=>`

                        <div
                          class="doc"
                          data-doc="${c.id}|${d.id}">
                          📄 ${escapeHtml(d.name)}
                        </div>

                      `).join("")

                    }

                  </div>

                </td>


                <td>

                  <div class="actions">

                    <button
                      class="secondary"
                      data-edit="${c.id}">
                      Modifier
                    </button>

                    <button
                      class="danger"
                      data-delete="${c.id}">
                      Supprimer
                    </button>

                  </div>

                </td>

              </tr>

              `;

            }).join("")}

          </tbody>

        </table>

        `

      }

    </div>

  `;


  document.getElementById("newBtn").onclick=()=>{
    openModal("new");
  };


  document.getElementById("exportBtn").onclick=exportCsv;


  document.getElementById("search").oninput=e=>{

    searchTerm=e.target.value;

    render();

    const input=document.getElementById("search");

    input.focus();

    input.setSelectionRange(
      searchTerm.length,
      searchTerm.length
    );

  };


  document.querySelectorAll("[data-activity]").forEach(btn=>{

    btn.onclick=()=>{

      filterActivite=btn.dataset.activity;

      render();

    };

  });


  document.querySelectorAll("[data-status]").forEach(btn=>{

    btn.onclick=()=>{

      filterStatut=btn.dataset.status;

      render();

    };

  });


  document.querySelectorAll("[data-edit]").forEach(btn=>{

    btn.onclick=()=>{
      openModal(btn.dataset.edit);
    };

  });


  document.querySelectorAll("[data-delete]").forEach(btn=>{

    btn.onclick=()=>{
      deleteClient(btn.dataset.delete);
    };

  });


  document.querySelectorAll("[data-doc]").forEach(el=>{

    el.onclick=()=>{

      const parts=el.dataset.doc.split("|");

      openDoc(parts[0],parts[1]);

    };

  });

}


/* =========================
   MODALE CLIENT
========================= */

function openModal(id){

  editingId=id;

  let client;

  if(id==="new"){

    client={
      nom:"",
      prenom:"",
      email:"",
      telephone:"",
      adresse:"",
      activite:"vitres",
      dateIntervention:"",
      typeIntervention:"",
      statut:"en_attente",
      notes:"",
      docs:[]
    };

  }else{

    client=clients.find(c=>c.id===id);

  }

  if(!client){
    toast("Client introuvable");
    return;
  }


  const overlay=document.createElement("div");

  overlay.className="overlay";
  overlay.id="overlay";


  overlay.innerHTML=`

    <div class="modal">

      <h2>
        ${id==="new"?"Nouveau client":"Modifier le client"}
      </h2>


      <div class="grid">

        <div class="field">

          <label>Prénom</label>

          <input
            id="f_prenom"
            value="${escapeAttr(client.prenom)}"
          >

        </div>


        <div class="field">

          <label>Nom</label>

          <input
            id="f_nom"
            value="${escapeAttr(client.nom)}"
          >

        </div>

      </div>


      <div class="grid">

        <div class="field">

          <label>Email</label>

          <input
            id="f_email"
            type="email"
            value="${escapeAttr(client.email)}"
          >

        </div>


        <div class="field">

          <label>Téléphone</label>

          <input
            id="f_telephone"
            value="${escapeAttr(client.telephone)}"
          >

        </div>

      </div>


      <div class="field">

        <label>Adresse</label>

        <input
          id="f_adresse"
          value="${escapeAttr(client.adresse)}"
        >

      </div>


      <div class="grid">

        <div class="field">

          <label>Activité</label>

          <select id="f_activite">

            ${ACTIVITES.map(a=>`

              <option
                value="${a.v}"
                ${client.activite===a.v?"selected":""}>
                ${a.label}
              </option>

            `).join("")}

          </select>

        </div>


        <div class="field">

          <label>Date d'intervention</label>

          <input
            id="f_date"
            type="date"
            value="${client.dateIntervention||""}"
          >

        </div>

      </div>


      <div class="field">

        <label>Type d'intervention</label>

        <input
          id="f_type"
          placeholder="Ex : nettoyage vitres, ramonage annuel..."
          value="${escapeAttr(client.typeIntervention)}"
        >

      </div>


      <div class="field">

        <label>Statut</label>

        <select id="f_statut">

          ${STATUTS.map(s=>`

            <option
              value="${s.v}"
              ${client.statut===s.v?"selected":""}>
              ${s.label}
            </option>

          `).join("")}

        </select>

      </div>


      <div class="field">

        <label>Notes</label>

        <textarea
          id="f_notes"
          rows="3"
        >${escapeHtml(client.notes||"")}</textarea>

      </div>


      <div class="field">

        <label>
          Ajouter un document PDF
        </label>

        <input
          type="file"
          id="f_file"
          accept="application/pdf"
        >

        <div class="muted">
          Maximum environ 3 Mo par fichier.
        </div>

      </div>


      <div class="modal-actions">

        <button
          class="secondary"
          id="cancelBtn">
          Annuler
        </button>

        <button
          class="primary"
          id="saveBtn">
          Enregistrer
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(overlay);


  document.getElementById("cancelBtn").onclick=()=>{
    overlay.remove();
  };


  overlay.onclick=e=>{

    if(e.target===overlay){
      overlay.remove();
    }

  };


  document.getElementById("saveBtn").onclick=()=>{
    saveClient(client);
  };

}


/* =========================
   ENREGISTREMENT CLIENT (SUPABASE)
========================= */

async function saveClient(original){

  const nom=document.getElementById("f_nom").value.trim();
  const prenom=document.getElementById("f_prenom").value.trim();

  if(!nom && !prenom){

    toast("Indique un nom ou un prénom.");

    return;
  }


  const id=editingId==="new"
    ? uid()
    : editingId;


  const client={

    id:id,

    nom:nom,

    prenom:prenom,

    email:document.getElementById("f_email").value.trim(),

    telephone:document.getElementById("f_telephone").value.trim(),

    adresse:document.getElementById("f_adresse").value.trim(),

    activite:document.getElementById("f_activite").value,

    dateIntervention:document.getElementById("f_date").value,

    typeIntervention:document.getElementById("f_type").value.trim(),

    statut:document.getElementById("f_statut").value,

    notes:document.getElementById("f_notes").value.trim(),

    docs:[...(original.docs||[])]

  };


  const file=document.getElementById("f_file").files[0];


  if(file){

    if(file.size>3.6*1024*1024){

      toast("PDF trop volumineux : maximum 3,6 Mo.");

      return;

    }


    try{

      const docId=uid();

      const path=`${id}/${docId}-${file.name}`;

      const {error:uploadError}=await supabaseClient
        .storage
        .from(BUCKET_DOCS)
        .upload(path,file,{
          contentType:"application/pdf",
          upsert:false
        });

      if(uploadError){
        throw uploadError;
      }

      client.docs.push({
        id:docId,
        name:file.name,
        path:path
      });

    }catch(error){

      console.error(error);

      toast("Erreur lors de l'enregistrement du PDF.");

      return;

    }

  }


  try{

    const {error:saveError}=await supabaseClient
      .from(TABLE_CLIENTS)
      .upsert(clientToRow(client));

    if(saveError){
      throw saveError;
    }

  }catch(error){

    console.error(error);

    toast("Erreur de sauvegarde Supabase.");

    return;

  }


  if(editingId==="new"){

    clients.push(client);

  }else{

    clients=clients.map(c=>
      c.id===id ? client : c
    );

  }


  document.getElementById("overlay").remove();


  render();


  toast("Client enregistré.");

}


/* =========================
   SUPPRESSION (SUPABASE)
========================= */

async function deleteClient(id){

  const client=clients.find(c=>c.id===id);

  if(!client){
    return;
  }


  const ok=confirm(
    `Supprimer ${client.prenom||""} ${client.nom||""} et ses documents ?`
  );


  if(!ok){
    return;
  }


  const paths=(client.docs||[]).map(d=>d.path).filter(Boolean);

  if(paths.length>0){

    try{

      await supabaseClient
        .storage
        .from(BUCKET_DOCS)
        .remove(paths);

    }catch(error){

      console.error(error);

    }

  }


  try{

    const {error}=await supabaseClient
      .from(TABLE_CLIENTS)
      .delete()
      .eq("id",id);

    if(error){
      throw error;
    }

  }catch(error){

    console.error(error);

    toast("Erreur lors de la suppression.");

    return;

  }


  clients=clients.filter(c=>c.id!==id);


  render();


  toast("Client supprimé.");

}


/* =========================
   OUVRIR DOCUMENT (SUPABASE STORAGE)
========================= */

async function openDoc(clientId,docId){

  const client=clients.find(c=>c.id===clientId);

  const doc=client && (client.docs||[]).find(d=>d.id===docId);

  if(!doc || !doc.path){

    toast("Document introuvable.");

    return;

  }

  const win=window.open();

  try{

    const {data,error}=await supabaseClient
      .storage
      .from(BUCKET_DOCS)
      .createSignedUrl(doc.path,60);

    if(error || !data || !data.signedUrl){
      throw error||new Error("URL manquante");
    }

    if(!win){

      toast("Autorise les fenêtres popup.");

      return;

    }

    win.location=data.signedUrl;

  }catch(error){

    console.error(error);

    if(win){
      win.close();
    }

    toast("Impossible d'ouvrir le document.");

  }

}


/* =========================
   EXPORT CSV
========================= */

function exportCsv(){

  const list=getClients();

  const headers=[
    "Nom",
    "Prénom",
    "Email",
    "Téléphone",
    "Adresse",
    "Activité",
    "Date intervention",
    "Type intervention",
    "Statut",
    "Notes"
  ];


  function csvValue(value){

    return `"${String(value??"").replace(/"/g,'""')}"`;

  }


  const rows=list.map(c=>[

    c.nom,
    c.prenom,
    c.email,
    c.telephone,
    c.adresse,
    activite(c.activite)?.label||"",
    c.dateIntervention,
    c.typeIntervention,
    statut(c.statut).label,
    c.notes

  ]);


  const csv=[

    headers.map(csvValue).join(","),

    ...rows.map(row=>
      row.map(csvValue).join(",")
    )

  ].join("\r\n");


  const blob=new Blob(
    ["\ufeff"+csv],
    {type:"text/csv;charset=utf-8"}
  );


  const url=URL.createObjectURL(blob);

  const link=document.createElement("a");

  link.href=url;

  link.download=
    "clients-"+new Date().toISOString().slice(0,10)+".csv";

  link.click();

  URL.revokeObjectURL(url);


  toast("Export CSV effectué.");

}


/* =========================
   SÉCURITÉ AFFICHAGE
========================= */

function escapeHtml(value){

  return String(value??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function escapeAttr(value){

  return escapeHtml(value);

}
